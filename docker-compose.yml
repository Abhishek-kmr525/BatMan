version: "3.9"

services:
  backend:
    build: ./backend
    container_name: amta-backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/amta.db
      CHROMA_DIR: /data/chroma
      KALSHI_PRIVATE_KEY_PATH: /data/kalshi_key.pem
    volumes:
      - amta-data:/data
      # Mount your PDFs read-only into the container; KNOWLEDGE_PDF_DIR in
      # .env should point at /knowledge to match.
      - "${KNOWLEDGE_PDF_DIR:-./knowledge}:/knowledge:ro"
      # Drop your kalshi_key.pem at this host path before booting if using real Kalshi.
      - ./backend/data/kalshi_key.pem:/data/kalshi_key.pem:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: amta-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/api/ws
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  amta-data:
